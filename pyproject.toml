[project]
name = "opencode-buddy"
version = "0.1.0"
description = "Scaffolder de projetos OpenCode com proxy LiteLLM (DeepSeek + Kimi + ChatGPT OAuth)"
requires-python = ">=3.12"
license = "MIT"
keywords = ["opencode", "litellm", "ai", "cli", "scaffolder", "deepseek", "kimi"]
dependencies = [
  "typer>=0.12",
  "pyyaml>=6.0",
]

[project.scripts]
opencode-buddy = "opencode_buddy.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opencode_buddy"]

[tool.hatch.build.targets.wheel.force-include]
"src/opencode_buddy/templates" = "opencode_buddy/templates"

[dependency-groups]
dev = [
  "pytest>=8.0",
]
