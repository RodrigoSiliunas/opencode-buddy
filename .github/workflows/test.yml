name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Run pytest
        run: uv run pytest -v

      - name: Smoke generate config
        shell: bash
        run: |
          uv run opencode-buddy init "$RUNNER_TEMP/smoke-project"
          test -f "$RUNNER_TEMP/smoke-project/opencode.json"
          test -f "$RUNNER_TEMP/smoke-project/litellm-config.yaml"
          test -f "$RUNNER_TEMP/smoke-project/.env.example"
          test -f "$RUNNER_TEMP/smoke-project/.gitignore"
          grep -qE '^\.env$' "$RUNNER_TEMP/smoke-project/.gitignore"
          grep -qE '^!\.env\.example$' "$RUNNER_TEMP/smoke-project/.gitignore"
          test -f "$RUNNER_TEMP/smoke-project/.opencode/project.md"
          test -f "$RUNNER_TEMP/smoke-project/.opencode/agents/orchestrator.md"
          uv run opencode-buddy validate "$RUNNER_TEMP/smoke-project"

      - name: Smoke keys validate
        shell: bash
        run: |
          uv run opencode-buddy keys validate --json > "$RUNNER_TEMP/keys.json"
          uv run python -c "import json,sys; data=json.load(open(sys.argv[1])); assert isinstance(data, list) and data, 'empty payload'; assert all('provider_key' in s and 'state' in s for s in data)" "$RUNNER_TEMP/keys.json"

      - name: Build wheel
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        shell: bash
        run: |
          uv build --wheel
          ls -la dist/
          # Confere que registry YAML e templates entraram no wheel.
          uv run python -m zipfile -l dist/opencode_buddy-*.whl | tee "$RUNNER_TEMP/wheel-list.txt"
          grep -q "opencode_buddy/model_registry.yaml" "$RUNNER_TEMP/wheel-list.txt"
          grep -q "opencode_buddy/templates/default.md" "$RUNNER_TEMP/wheel-list.txt"
          grep -q "opencode_buddy/templates/orchestrator.md" "$RUNNER_TEMP/wheel-list.txt"

      - name: Smoke install wheel
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        shell: bash
        run: |
          uv tool install dist/opencode_buddy-*.whl
          opencode-buddy --help
          opencode-buddy doctor || true   # doctor pode falhar (sem CLI opencode no runner)
