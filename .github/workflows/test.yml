name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Run pytest
        run: uv run pytest -v

      - name: Smoke generate config
        shell: bash
        run: |
          uv run opencode-buddy init "$RUNNER_TEMP/smoke-project"
          test -f "$RUNNER_TEMP/smoke-project/opencode.json"
          test -f "$RUNNER_TEMP/smoke-project/litellm-config.yaml"
          test -f "$RUNNER_TEMP/smoke-project/.env.example"
          test -f "$RUNNER_TEMP/smoke-project/.opencode/agents/orchestrator.md"
